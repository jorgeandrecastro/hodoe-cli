[package]
name          = "hodoe-cli"
version       = "0.4.1"
edition       = "2024"
authors       = ["Jorge Andre Castro <georgeandrec@gmail.com>"]
license       = "GPL-2.0-or-later"
description   = "CLI HODOE pour le déploiement de binaires embarqués sur microcontrôleurs."
repository    = "https://github.com/jorgeandrecastro/hodoe-cli"
documentation = "https://docs.rs/hodoe-cli"
readme        = "README.md"
keywords      = ["cli", "embedded", "firmware", "esp32", "deployment"]
categories    = ["command-line-utilities", "embedded"]
rust-version  = "1.85"

# On ne compile que le binaire exécutable CLI
autolib      = false
autobins     = false
autoexamples = false
autotests    = false
autobenches  = false

[[bin]]
name = "hodoe"
path = "src/main.rs"

[dependencies]
clap       = { version = "4.6", features = ["derive"] }
reqwest    = { version = "0.13", features = ["json", "stream"] }
tokio      = { version = "1.53", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs       = "7.0"
indicatif  = "0.18"
console    = "0.16"

[profile.release]
opt-level     = "z"     # Optimise la taille du binaire CLI
lto           = true    # Optimisation globale au lien
codegen-units = 1       # Réduit au maximum la taille finale
panic         = "abort" # Supprime le code de débobinage inutile
strip         = true    # Nettoie tous les symboles de debug